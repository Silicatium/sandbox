image:
  tag: latest
  backend: ghcr.io/silicatium/sandbox-backend
  frontend: ghcr.io/silicatium/sandbox-frontend
  postgres: postgres:15-alpine

ports:
  backend: 8081
  frontend: 8888
  postgres: 5432
  nodePort: 30080

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

postgres:
  secretName: sandbox-db
  storage: 1Gi