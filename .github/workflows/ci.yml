name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия для повторного деплоя или отката (например, 20261111-101500). Пусто — собрать новую."
        required: false
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Version generate
        run: echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        id: version

      
  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker buildx 
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ secrets.NEXUS_HOST }}"]
            http = true

      - name: Login to ghcr 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker for insecure registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["${{ secrets.NEXUS_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to nexus 
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Metadata action 
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/yanbaevmm-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push 
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab3'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          DEPLOY_VERSION="${{ github.event.inputs.VERSION }}"
          if [ -z "$DEPLOY_VERSION" ]; then
            DEPLOY_VERSION="${{ needs.version.outputs.version }}"
          fi

          echo "${{ secrets.APP_ENV_FILE }}" > .env
          
          #REGISTRY="${{ vars.IMAGE_REGISTRY }}"
          #if [ -z "$REGISTRY" ]; then
          #  REGISTRY="${{ secrets.NEXUS_HOST }}"
          #fi
          REGISTRY="ghcr.io"
          
          echo "IMAGE_REGISTRY=$REGISTRY" >> .env
          echo "IMAGE_TAG=$DEPLOY_VERSION" >> .env
          echo "VERSION=$DEPLOY_VERSION" >> .env

      - name: SCP to VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            src/docker-compose.yml .env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd ~/
            
            #REGISTRY="${{ secrets.IMAGE_REGISTRY }}"
            #if [ -z "$REGISTRY" ]; then
            #  REGISTRY="${{ secrets.NEXUS_HOST }}"
            #fi
            REGISTRY="ghcr.io"

            if [ "$REGISTRY" == "ghcr.io" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login $REGISTRY -u ${{ secrets.NEXUS_REPO_USER }} --password-stdin
            fi

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans --force-recreate
            sudo docker image prune -f
          EOF

      - name: Health check
        run: |
          curl -f http://${{ secrets.VM_HOST }}:8881/health  exit 1

      
