name: cd

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образов (например, 20261119-214623)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-sa-key.json"

          yc config profile create default
          yc config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"
      
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          sed -i 's|command: .*/yc$|command: yc|' ~/.kube/config
          kubectl config use-context yc-sandbox

      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get pods -n default
          kubectl auth can-i create deployments -n default
          kubectl auth can-i create services -n default

      - name: Install Helm
        uses: azure/setup-helm@v4.1.0
        with:
          version: 'v3.16.2'

      - name: Deploy with Helm
        run: |
          helm upgrade --install sandbox ./helm/sandbox \
            --set image.tag="${{ inputs.VERSION }}" \
            --namespace default \
            --wait
